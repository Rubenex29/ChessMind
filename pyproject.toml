[project]
name = "chessmind"
version = "0.1.0"
description = "Adaptive chess AI with RAG, player memory and Stockfish analysis"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "chess>=1.11.2",
    "stockfish>=2.4.0",
    "pydantic>=2.10.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
